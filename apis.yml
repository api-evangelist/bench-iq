name: Bench IQ
description: Bench IQ is a legal technology company building an AI-powered judicial
  intelligence platform that analyzes how individual judges reason and rule. Rather
  than limiting analysis to the roughly 3% of matters that produce written opinions,
  Bench IQ studies the reasoning behind all of a judge's rulings so litigators can
  anticipate decisions, craft stronger arguments, and shape case strategy. Founded
  by the team behind ROSS Intelligence — CEO Jimoh Ovbiagele and CTO Maxim Isakov —
  together with former Kirkland & Ellis restructuring partner Jeffrey Gettleman, the
  company says four of the top five AmLaw 100 firms rely on its analysis. It is backed
  by Battery Ventures, Inovia Capital, and Haystack, along with leading law firms
  including Wilson Sonsini Goodrich & Rosati, Fenwick & West, and Cooley.
